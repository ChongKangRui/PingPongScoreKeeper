<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Pong Score Keeper</title>
    <link rel="stylesheet" href="app.css">

</head>

<body>


    <!-- ----------------------- -->
    <div class="container">

        <div class="column">
            <div class="column is-half is-offset-one-quarter">
                <div class="card">

                    <div class="card-image">
                        <figure class="image is-2by1">
                            <img src="https://media.istockphoto.com/id/1425158165/photo/table-tennis-ping-pong-paddles-and-white-ball-on-blue-board.jpg?s=612x612&w=0&k=20&c=KSdi4bEGoxdhaGMnl6CZaqTLbKbobArgrrpLem3oN98="
                                alt="">
                        </figure>

                    </div>
                    <header class="card-header">
                        <p class="card-header-title is-centered">Ping Pong Score Keeper</p>


                    </header>
                    <div class="card-content">
                        <div class="content has-text-centered">
                            <h1 id='score'><span id="p1s">0</span> to <span id="p2s">0</span>
                            </h1>
                            <p class="subtitles">Use the buttons below to keep score</p>

                            <label for="playingTo" class="label is-large is-inline">Playing To </label>
                            <div class="select is-rounded">
                                <select name="playingTo" id="winningScoreSelection">

                                </select>
                            </div>
                        </div>
                    </div>
                    <footer class="card-footer">
                        <button class="card-footer-item button is-primary" id="p1btn">+1 Player One </button>
                        <button class="card-footer-item button is-info" id="p2btn">+1 Player Two </button>
                        <button class="card-footer-item button is-danger" id="resetBtn">Reset </button>
                    </footer>
                </div>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
